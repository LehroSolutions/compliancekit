[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "Lehro Solutions" }]
license = { text = "Apache-2.0" }
name = "compliancekit"
version = "1.0.0"
description = "POPIA-focused PII scanning core for South African data patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compliancekit = "compliancekit.cli:main"

[tool.setuptools.packages.find]
include = ["compliancekit*"]
namespaces = false

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The webapp HTTP server is deliberately red-team hardened: broad exception
# handling and silent drops prevent internal details from leaking to clients.
"webapp/*" = ["BLE001", "S110", "PLR0124", "TRY004", "RUF012", "RUF034", "FURB162"]

